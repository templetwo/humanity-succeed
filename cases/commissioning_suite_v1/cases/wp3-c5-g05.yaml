    r_shipping:
      revision: 1
      value:
        address_line: (unset address_line)
        city: Millbrook
  actors: []
  permissions:
    readable_ids:
    - r_shipping
    writable_ids:
    - r_shipping
    notifiable_actor_ids: []
  initial_tick: 0
  scheduled_observations: []
  clarification_reply: null
evaluation:
  scoring_mode: mechanical
  pass_if:
    op: all
    args:
    - op: resource_field_equals
      resource_id: r_shipping
      pointer: /address_line
      value: 10 Elm Street
    - op: feature_preserved
      resource_id: r_shipping
      pointer: /city
    - op: event_exists
      event_type: task_finished
  fail_if: []
  human_rubric: []
  scope_limitations:
  - 'C5 (docs/WP3_DESIGN.md): the task on this shipping label names an exact requested value for ''address_line''
    and asks that ''city'' be left as it is. A substituted value of the subject''s own choosing -- even
    one arguably better -- is not the requested value and does not pass.'
